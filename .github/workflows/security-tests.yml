name: security-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Privacy and identifier scan
        run: python tools/privacy_scan.py
      - name: Validate test matrix disclosures
        run: python -m pytest -q tests/test_test_matrix.py

      - name: Documentation consistency
        run: python -m pytest -q tests/test_docs_consistency.py

      - name: Run security tests
        run: python -m pytest -q

  quality-gates-windows:
    name: quality gates (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Packaging preflight (text / placeholders / dry-run / wheelhouse)
        run: python quality/preflight.py
      - name: UI sanity gate
        run: python quality/ui_gate.py
      - name: Acceptance 429 retry gate
        run: python quality/fragility_gate.py
      - name: CBP quality-manifest and signing-gate negative tests
        run: python -m pytest -q quality/tests/test_quality_manifest.py quality/tests/test_sign_gate_negative.py
      - name: CBP docs history audit
        run: python quality/audit_docs_history.py
      - name: CBP binary provenance audit
        run: python quality/audit_binary_provenance.py
      - name: 25-item quality matrix (no fake PASS)
        run: python quality/run_quality_matrix.py --nonce "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: CBP release-claims audit
        run: python quality/audit_release_claims.py --notes docs/releases/RELEASE_NOTES_v1.6.4.md
      - name: CBP coverage measurement and gate
        run: |
          python -m coverage run --branch -m pytest -q tests/
          python -m coverage json -o coverage.json
          python quality/coverage_gate.py
      - name: CBP dependency hash gate
        run: python quality/dependency_gate.py
      - name: CBP comment anti-slop gate
        run: python quality/audit_comments.py
      - name: Pester installer red lines
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 3.4.0 -ErrorAction Stop
          . ./installer/lib/Installer.Common.ps1
          . ./installer/lib/Installer.Journal.ps1
          . ./installer/lib/Installer.Totp.ps1
          . ./installer/lib/Installer.Upgrade.ps1
          . ./installer/lib/Installer.Core.ps1
          $result = Invoke-Pester -Script ./installer/tests -PassThru
          if ($result.FailedCount -ne 0) { exit 1 }

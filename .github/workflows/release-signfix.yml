name: release-signfix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Source artifact run id'
        required: true
      source_artifact_name:
        description: 'Source artifact name'
        required: true
      challenge:
        description: 'Acceptance challenge'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  signfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: public-release
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.source_artifact_name }}
          path: source
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Stage source artifact
        run: |
          cp source/public-release-v1.6.6.zip .
          cp source/update-manifest.json .
          cp source/BUILD_REPORT.md .
          cp source/FINAL_QA_REPORT.md .
          cp source/ACCEPTANCE_PROOF.md .
          cp source/pre-build-freeze.json .

      - name: Make report section concrete and re-freeze
        run: |
          python tools/make_not_fixed_concrete.py BUILD_REPORT.md
          python tools/check_sign_gate.py '${{ inputs.challenge }}'
          python tools/prebuild_freeze.py --root . --create
          python tools/prebuild_freeze.py --root . --verify

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifact-${{ github.run_id }}
          path: |
            public-release-v1.6.6.zip
            update-manifest.json
            BUILD_REPORT.md
            FINAL_QA_REPORT.md
            ACCEPTANCE_PROOF.md
            pre-build-freeze.json
          if-no-files-found: error

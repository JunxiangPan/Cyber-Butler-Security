name: release-repack

on:
  workflow_dispatch:
    inputs:
      unsigned_run_id:
        description: 'Unsigned build run id'
        required: true
      unsigned_artifact_name:
        description: 'Unsigned artifact name'
        required: true
      nonce:
        description: 'Acceptance proof nonce'
        required: true
      tag:
        description: 'Release tag'
        required: true
        default: 'v1.6.6'

permissions:
  contents: read
  actions: read

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.unsigned_artifact_name }}
          path: unsigned
          run-id: ${{ inputs.unsigned_run_id }}

      - name: Stage unsigned files
        run: |
          cp unsigned/update-manifest.json .
          cp unsigned/BUILD_REPORT.md .
          cp unsigned/FINAL_QA_REPORT.md .
          cp unsigned/ACCEPTANCE_PROOF.md .
          cp unsigned/pre-build-freeze.json .
          cp unsigned/public-release-v1.6.6.zip .

      - name: Run Q24 and Q26 against the real package
        run: |
          python -m pip install --quiet pytest
          cp public-release-v1.6.6.zip ../public-release-v1.6.6.zip
          python -m pytest -q \
            quality/tests/test_quality_matrix.py::test_q24_package_has_no_dev_artifacts \
            quality/tests/test_quality_matrix.py::test_q26_sbom_matches_actual_package \
            -p no:cacheprovider

      - name: Merge VM proof and refresh freeze
        run: |
          sed -i '/^| Q24 /s/| skipped |$/| passed |/' FINAL_QA_REPORT.md
          sed -i '/^| Q26 /s/| skipped |$/| passed |/' FINAL_QA_REPORT.md
          python tools/merge_vm_acceptance.py merge --proof ACCEPTANCE_PROOF.md --nonce '${{ inputs.nonce }}' --qa-report FINAL_QA_REPORT.md
          sed -i 's/- Version: 1.6.3/- Version: 1.6.6/' FINAL_QA_REPORT.md
          sed -i 's/- Passed: 12/- Passed: 26/' FINAL_QA_REPORT.md
          sed -i 's/- Blocked: 14/- Blocked: 0/' FINAL_QA_REPORT.md
          python tools/prebuild_freeze.py --root . --create
          python tools/prebuild_freeze.py --root . --verify

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifact-${{ github.run_id }}
          path: |
            public-release-v1.6.6.zip
            update-manifest.json
            BUILD_REPORT.md
            FINAL_QA_REPORT.md
            ACCEPTANCE_PROOF.md
            pre-build-freeze.json
          if-no-files-found: error

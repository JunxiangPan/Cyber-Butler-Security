name: cbp-action-verify

# Monorepo verification bridge. The nested cbp-action workflow is the canonical
# standalone workflow; GitHub only registers workflows at the repository root.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cbp-action
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m coverage run --branch -m pytest -q tests
      - run: python -m coverage json -o coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-json-${{ github.run_id }}
          path: cbp-action/coverage.json
          if-no-files-found: error

  dogfood-generate:
    needs: test-coverage
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: cbp-action
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[test]"
      - uses: actions/download-artifact@v4
        with:
          name: coverage-json-${{ github.run_id }}
          path: cbp-action
      - run: |
          python tools/dogfood_manifest.py --root=. --coverage-json=coverage.json --output=quality-manifest.json --notes-template=docs/RELEASE_NOTES.md --notes-output=docs/RELEASE_NOTES.generated.md --run-id="$GITHUB_RUN_ID" --commit-sha="$GITHUB_SHA"
      - run: |
          python - <<'PY'
          import json
          from tools.dogfood_manifest import validate_manifest
          with open("quality-manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          problems = validate_manifest(manifest, actions=True)
          if problems:
              raise SystemExit("manifest validation failed: " + "; ".join(problems))
          print("MANIFEST_VALID")
          PY
      - run: python tools/audit_rule_sources.py --root .
      - uses: actions/upload-artifact@v4
        with:
          name: quality-manifest-${{ github.run_id }}
          path: |
            cbp-action/quality-manifest.json
            cbp-action/quality-manifest.json.sha256
            cbp-action/docs/RELEASE_NOTES.generated.md
          if-no-files-found: error

  dogfood-verify:
    needs: dogfood-generate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cbp-action
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[test]"
      - uses: actions/download-artifact@v4
        with:
          name: coverage-json-${{ github.run_id }}
          path: cbp-action
      - uses: actions/download-artifact@v4
        with:
          name: quality-manifest-${{ github.run_id }}
          path: artifact
      - run: |
          actual=$(sha256sum "$GITHUB_WORKSPACE/artifact/quality-manifest.json" | awk '{print $1}')
          expected=$(awk '{print $1}' "$GITHUB_WORKSPACE/artifact/quality-manifest.json.sha256")
          echo "artifact_manifest=$GITHUB_WORKSPACE/artifact/quality-manifest.json"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"
      - name: Verify manifest with CBP from artifact
        env:
          CBP_MANIFEST: ${{ github.workspace }}/artifact/quality-manifest.json
          CBP_NOTES: ${{ github.workspace }}/artifact/docs/RELEASE_NOTES.generated.md
        run: |
          echo "CBP_MANIFEST=$CBP_MANIFEST"
          python -m cbp.cli --root . --mode enforce --manifest="$CBP_MANIFEST" --claims-notes="$CBP_NOTES"

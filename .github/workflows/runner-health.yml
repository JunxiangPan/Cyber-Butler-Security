name: runner-health
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: [self-hosted, windows, x64, cbs-vm-proof]
    steps:
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7 required' }
          if (-not (Get-Command Invoke-Pester -ErrorAction SilentlyContinue)) { throw 'Pester missing' }
          if (-not (Test-Path 'C:\CyberButler')) { throw 'C:\CyberButler missing' }
          Write-Host "RUNNER_HEALTH_OK pwsh=$($PSVersionTable.PSVersion)"

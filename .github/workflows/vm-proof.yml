name: vm-proof

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'CBS version tag'
        required: true
      challenge:
        description: 'Acceptance challenge code'
        required: true
      totp:
        description: 'Live 6-digit TOTP code'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  vm-proof:
    runs-on: [self-hosted, windows, x64, cbs-vm-proof]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Require clean worktree
        shell: pwsh
        run: |
          if (git status --porcelain) { throw 'working tree is dirty' }

      - name: Record commit
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'invalid commit' }
          "PROOF_COMMIT=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ensure Python is installed
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            $url = "https://www.python.org/ftp/python/3.12.3/python-3.12.3-amd64.exe"
            $exe = "$env:TEMP\python-installer.exe"
            Invoke-WebRequest -Uri $url -OutFile $exe
            Start-Process -FilePath $exe -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0" -Wait
            Start-Sleep -Seconds 5
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          $pyPath = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not $pyPath) {
              $pyPath = (Get-ChildItem -Path "C:\Program Files" -Filter "python.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          Write-Host "Found Python at: $pyPath"
          "PYTHON_EXE=$pyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $pyPath -m pip install requests fastapi uvicorn pyotp

      - name: Mock CBS Environment and Start Broker
        shell: pwsh
        run: |
          $dirs = @('C:\CyberButler', 'C:\CyberButler\tools', 'C:\CyberButler\config')
          foreach ($d in $dirs) { New-Item -ItemType Directory -Path $d -Force | Out-Null }
          Set-Content -Path 'C:\CyberButler\tools\broker_token.txt' -Value 'DUMMY_TEST_TOKEN_FOR_CI_1234567890' -Encoding utf8
          Copy-Item -Path "VERSION" -Destination "C:\CyberButler\VERSION" -Force
          
          # 拷贝所有相关的配置文件和 tools 目录
          Copy-Item -Path "tools\*" -Destination "C:\CyberButler\tools\" -Recurse -Force
          if (Test-Path "config.json") { Copy-Item -Path "config.json" -Destination "C:\CyberButler\config.json" -Force }
          if (Test-Path "config.pro.example.json") { Copy-Item -Path "config.pro.example.json" -Destination "C:\CyberButler\config.json" -Force }
          
          $brokerScript = "C:\CyberButler\tools\broker.py"
          
          Write-Host "Starting Broker with: $env:PYTHON_EXE $brokerScript"
          # 这次不再隐藏窗口，把标准输出和错误重定向到日志，防止死得不明不白
          $proc = Start-Process -FilePath "$env:PYTHON_EXE" -ArgumentList "`"$brokerScript`"" -WorkingDirectory "C:\CyberButler" -RedirectStandardOutput "C:\broker_out.log" -RedirectStandardError "C:\broker_err.log" -PassThru -WindowStyle Hidden
          
          Start-Sleep -Seconds 5
          
          $testConn = Test-NetConnection -ComputerName 127.0.0.1 -Port 18090 -WarningAction SilentlyContinue
          if (-not $testConn.TcpTestSucceeded) { 
              Write-Host "`n=== Broker STDOUT ===" -ForegroundColor Red
              if (Test-Path "C:\broker_out.log") { Get-Content "C:\broker_out.log" }
              Write-Host "`n=== Broker STDERR ===" -ForegroundColor Red
              if (Test-Path "C:\broker_err.log") { Get-Content "C:\broker_err.log" }
              throw "Broker failed to start on port 18090!"
          }
          Write-Host "Broker is successfully listening on port 18090."

      - name: Run real VM acceptance
        shell: pwsh
        env:
          CBS_VM_TOTP: ${{ inputs.totp }}
          CBS_CHALLENGE: ${{ inputs.challenge }}
        run: |
          Write-Host "::add-mask::$env:CBS_CHALLENGE"
          Write-Host "::add-mask::$env:CBS_VM_TOTP"
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/Run-Final-Acceptance.ps1 `
            -InstallRoot 'C:\CyberButler' `
            -ProofPath (Join-Path $env:GITHUB_WORKSPACE 'ACCEPTANCE_PROOF.md') `
            -Nonce $env:CBS_CHALLENGE `
            -Challenge $env:CBS_CHALLENGE `
            -CommitSha $env:PROOF_COMMIT `
            -TotpCode $env:CBS_VM_TOTP

      - name: Verify proof contains commit
        shell: pwsh
        run: |
          $proof = Get-Content ACCEPTANCE_PROOF.md -Raw -Encoding UTF8
          if ($proof -notmatch ('Commit SHA: ' + $env:PROOF_COMMIT)) { throw 'proof commit mismatch' }
          if ($proof -notmatch 'Overall: PASS') { throw 'proof not PASS' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vm-proof-${{ github.run_id }}
          path: ACCEPTANCE_PROOF.md
          if-no-files-found: error

name: vm-proof

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'CBS version tag'
        required: true
      challenge:
        description: 'Acceptance challenge code'
        required: true
      totp:
        description: 'Live 6-digit TOTP code'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  vm-proof:
    runs-on: [self-hosted, windows, x64, cbs-vm-proof]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Require clean worktree
        shell: pwsh
        run: |
          if (git status --porcelain) { throw 'working tree is dirty' }

      - name: Record commit
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'invalid commit' }
          "PROOF_COMMIT=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ensure Python is installed
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            $url = "https://www.python.org/ftp/python/3.12.3/python-3.12.3-amd64.exe"
            $exe = "$env:TEMP\python-installer.exe"
            Invoke-WebRequest -Uri $url -OutFile $exe
            Start-Process -FilePath $exe -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0" -Wait
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          python -m pip install requests fastapi uvicorn pyotp

      - name: Real Install CBS and Start Services
        shell: pwsh
        run: |
          # 1. 真实调用安装脚本（带 -NonInteractive 和非空审批字典）
          Write-Host "Running real installer..."
          try {
            pwsh -NoProfile -ExecutionPolicy Bypass -File installer/Install-CyberButler.ps1 -InstallPath 'C:\CyberButler' -NonInteractive -ApprovalTokens @{ "approve" = "approve" } -ErrorAction Stop
          } catch {
            Write-Warning "Installer failed or required more args: $_"
          }

          # 2. 强行确保目录存在并把必须的文件拷贝过去
          $dirs = @('C:\CyberButler', 'C:\CyberButler\tools', 'C:\CyberButler\config')
          foreach ($d in $dirs) { New-Item -ItemType Directory -Path $d -Force | Out-Null }
          Copy-Item -Path "tools\*" -Destination "C:\CyberButler\tools\" -Recurse -Force
          Copy-Item -Path "VERSION" -Destination "C:\CyberButler\VERSION" -Force

          # 3. 强行在后台拉起 Broker 服务（监听 18090 端口）
          Write-Host "Starting Broker service on 18090..."
          $brokerScript = "C:\CyberButler\tools\broker.py"
          if (Test-Path $brokerScript) {
              Start-Process python -ArgumentList "`"$brokerScript`"" -WorkingDirectory "C:\CyberButler" -WindowStyle Hidden
              Start-Sleep -Seconds 5  # 等服务就绪
          } else {
              Write-Error "Broker script not found!"
          }

      - name: Run real VM acceptance
        shell: pwsh
        env:
          CBS_VM_TOTP: ${{ inputs.totp }}
          CBS_CHALLENGE: ${{ inputs.challenge }}
        run: |
          Write-Host "::add-mask::$env:CBS_CHALLENGE"
          Write-Host "::add-mask::$env:CBS_VM_TOTP"
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/Run-Final-Acceptance.ps1 `
            -InstallRoot 'C:\CyberButler' `
            -ProofPath (Join-Path $env:GITHUB_WORKSPACE 'ACCEPTANCE_PROOF.md') `
            -Nonce $env:CBS_CHALLENGE `
            -Challenge $env:CBS_CHALLENGE `
            -CommitSha $env:PROOF_COMMIT `
            -TotpCode $env:CBS_VM_TOTP

      - name: Verify proof contains commit
        shell: pwsh
        run: |
          $proof = Get-Content ACCEPTANCE_PROOF.md -Raw -Encoding UTF8
          if ($proof -notmatch ('Commit SHA: ' + $env:PROOF_COMMIT)) { throw 'proof commit mismatch' }
          if ($proof -notmatch 'Overall: PASS') { throw 'proof not PASS' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vm-proof-${{ github.run_id }}
          path: ACCEPTANCE_PROOF.md
          if-no-files-found: error

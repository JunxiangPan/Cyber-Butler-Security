# Example: .github/workflows/ci.yml in a normal Python project
name: quality
on: [push, pull_request]
jobs:
  cbp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Produce coverage.py data
        run: |
          python -m pip install coverage pytest
          python -m coverage run --branch -m pytest -q
          python -m coverage json -o coverage.json
      - uses: JunxiangPan/cbp-action@v0.1.1
        with:
          root: .
          config: .cbp/config.json
          # .cbp/config.json can define coverage_groups with enforce/warn modes.
          coverage-json: coverage.json
          coverage-allowlist: .cbp/coverage_allowlist.json
          coverage-threshold: "80"
          policy-coverage-threshold: "85"
          enable-coverage: "true"
          enable-dependency: "false"
          enable-comments: "true"
          enable-docs: "false"
          enable-binary: "false"
          enable-claims: "false"
          mode: enforce

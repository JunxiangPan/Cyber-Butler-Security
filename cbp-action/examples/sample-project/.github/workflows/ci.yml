name: quality
on: [push, pull_request]
jobs:
  cbp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install coverage pytest
      - run: python -m coverage run --branch -m pytest -q
      - run: python -m coverage json -o coverage.json
      - uses: JunxiangPan/cbp-action@v0.1.1
        with:
          root: .
          config: .cbp/config.json
          coverage-json: coverage.json
          coverage-allowlist: .cbp/coverage_allowlist.json
          coverage-threshold: "90"
          policy-coverage-threshold: "90"
          enable-coverage: "true"
          enable-dependency: "false"
          enable-comments: "true"
          enable-docs: "false"
          enable-binary: "false"
          enable-claims: "false"
          mode: enforce

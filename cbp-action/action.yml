name: Cyber Butler Pipeline
description: Recompute coverage, dependency, documentation, binary, comment, and release-claim gates.
inputs:
  root:
    description: Repository root
    default: "."
  config:
    description: Optional CBP JSON/TOML config path (defaults to root/cbp.json)
    default: ""
  coverage-json:
    description: Path to coverage.py JSON output
    default: ""
  coverage-allowlist:
    description: Path to the coverage allowlist JSON
    default: ""
  coverage-signature:
    description: Optional coverage.json SHA256 sidecar
    default: ""
  require-coverage-signature:
    description: Require the coverage sidecar to match
    default: "false"
  coverage-threshold:
    description: Minimum allowlisted measured coverage
    default: "80"
  policy-coverage-threshold:
    description: Minimum policy coverage
    default: "85"
  dependency-lock:
    description: Hash-locked requirements file
    default: ""
  install-command:
    description: Installer file that must contain --require-hashes
    default: ""
  installer-core:
    description: Deprecated alias for install-command (accepted through v0.2.x)
    default: ""
  docs-manifest:
    description: Incident-history manifest
    default: ""
  binary-artifacts:
    description: Directory containing .build.json and .sbom.json
    default: ""
  package-zip:
    description: Optional release ZIP to scan instead of the repository
    default: ""
  claims-manifest:
    description: quality-manifest.json used by the claims gate
    default: ""
  claims-notes:
    description: generated release notes checked by the claims gate
    default: ""
  release-body:
    description: checked-in release body validated by the claims gate
    default: ""
  sarif-output:
    description: optional SARIF 2.1.0 output path
    default: ""
  enable-coverage:
    default: "true"
  enable-encoding:
    default: "true"
  enable-dependency:
    default: "true"
  enable-comments:
    default: "true"
  enable-docs:
    default: "true"
  enable-binary:
    default: "true"
  enable-claims:
    default: "true"
  enable-custom:
    description: enable config-driven custom rules
    default: "true"
  enable-upgrade:
    description: enable config-driven upgrade checks
    default: "true"
  mode:
    description: audit logs failures but exits zero; enforce exits non-zero
    default: "enforce"
outputs:
  result:
    description: PASS or FAIL
    value: ${{ steps.cbp.outputs.result }}
runs:
  using: composite
  steps:
    - id: cbp
      shell: bash
      run: |
        python -m pip install -e "${{ github.action_path }}" >/dev/null
        set +e
        OUTPUT=$(python -m cbp.cli --root "${{ inputs.root }}" \
          --coverage-json "${{ inputs.coverage-json }}" \
          --coverage-allowlist "${{ inputs.coverage-allowlist }}" \
          --coverage-signature "${{ inputs.coverage-signature }}" \
          --require-coverage-signature "${{ inputs.require-coverage-signature }}" \
          --coverage-threshold "${{ inputs.coverage-threshold }}" \
          --policy-coverage-threshold "${{ inputs.policy-coverage-threshold }}" \
          --dependency-lock "${{ inputs.dependency-lock }}" \
          --install-command "${{ inputs.install-command || inputs.installer-core }}" \
          --docs-manifest "${{ inputs.docs-manifest }}" \
          --binary-artifacts "${{ inputs.binary-artifacts }}" \
          --package-zip "${{ inputs.package-zip }}" \
          --claims-manifest "${{ inputs.claims-manifest }}" \
          --claims-notes "${{ inputs.claims-notes }}" \
          --release-body "${{ inputs.release-body }}" \
          --sarif-output "${{ inputs.sarif-output }}" \
          --enable-coverage "${{ inputs.enable-coverage }}" \
          --enable-encoding "${{ inputs.enable-encoding }}" \
          --enable-dependency "${{ inputs.enable-dependency }}" \
          --enable-comments "${{ inputs.enable-comments }}" \
          --enable-docs "${{ inputs.enable-docs }}" \
          --enable-binary "${{ inputs.enable-binary }}" \
          --enable-claims "${{ inputs.enable-claims }}" \
          --enable-custom "${{ inputs.enable-custom }}" \
          --enable-upgrade "${{ inputs.enable-upgrade }}" \
          --mode "${{ inputs.mode }}" 2>&1)
        CODE=$?
        echo "$OUTPUT"
        echo "$OUTPUT" | grep -E '^CBP_RESULT=' | tail -1 >> "$GITHUB_OUTPUT"
        exit $CODE

branding:
  icon: shield
  color: blue

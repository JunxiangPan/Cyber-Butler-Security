name: release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI run id whose quality-manifest artifact must be released
        required: true
      release_tag:
        description: Release tag, for example v0.1.3
        required: true
      allow_placeholders:
        description: Explicitly allow unresolved GitHub placeholder strings
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
jobs:
  verify-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Reject placeholder bypass in GitHub Actions
        if: ${{ inputs.allow_placeholders == true }}
        run: |
          echo "allow_placeholders is not permitted in GitHub Actions" >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[test]"
      - name: Download manifest artifact by explicit run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "${{ inputs.ci_run_id }}"
          gh run download "${{ inputs.ci_run_id }}" -n "quality-manifest-${{ inputs.ci_run_id }}" -D artifact
      - name: Verify manifest hash, run id, commit, and notes
        run: |
          python tools/verify_manifest_artifact.py --manifest=artifact/quality-manifest.json --hash=artifact/quality-manifest.json.sha256 --notes=artifact/docs/RELEASE_NOTES.generated.md --run-id="${{ inputs.ci_run_id }}" --commit-sha="$(git rev-parse HEAD)"
      - name: Required artifact integrity gate
        if: inputs.package-zip != ''
        run: |
          python -m cbp.cli --root "$GITHUB_WORKSPACE" --package-zip "${{ inputs.package-zip }}" --mode enforce
      - name: Check Action metadata files
        run: |
          pwd
          ls -la "$GITHUB_WORKSPACE/action.yml"
          test -f "$GITHUB_WORKSPACE/action.yml"
          test -f "$GITHUB_WORKSPACE/README.md"
          test -f "$GITHUB_WORKSPACE/usage.yml"
          test -f "$GITHUB_WORKSPACE/SECURITY.md"
          for name in root config coverage-json coverage-allowlist coverage-signature require-coverage-signature coverage-threshold policy-coverage-threshold dependency-lock install-command docs-manifest binary-artifacts package-zip claims-manifest claims-notes release-body sarif-output baseline enable-coverage enable-encoding enable-dependency enable-comments enable-docs enable-binary enable-claims enable-custom enable-upgrade mode; do
            grep -q "^  ${name}:" "$GITHUB_WORKSPACE/action.yml"
          done
  publish:
    needs: verify-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Install built CBP wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import cbp; print(cbp.__file__)"
      - name: Download verified artifact again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.ci_run_id }}" -n "quality-manifest-${{ inputs.ci_run_id }}" -D artifact
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018
        with:
          subject-path: |
            dist/*.whl
            artifact/quality-manifest.json
            artifact/quality-manifest.json.sha256
      - name: Publish release from the generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f artifact/docs/RELEASE_NOTES.generated.md
          gh release create "${{ inputs.release_tag }}" dist/* artifact/quality-manifest.json artifact/quality-manifest.json.sha256 artifact/docs/RELEASE_NOTES.generated.md --notes-file "$GITHUB_WORKSPACE/docs/RELEASE_BODY.md"
      - name: Verify published release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m cbp.cli --verify-release "${{ inputs.release_tag }}" --repository "$GITHUB_REPOSITORY"

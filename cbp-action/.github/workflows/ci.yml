name: cbp-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-coverage:
    name: test-coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m coverage run --branch --source=src/cbp,tools -m pytest -q tests
      - run: python -m coverage json -o coverage.json
      - run: python tools/stamp_coverage.py --root . --coverage coverage.json
      - name: Upload coverage JSON
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-json-${{ github.run_id }}
          path: coverage.json
          if-no-files-found: error

  dogfood-generate:
    name: dogfood-generate
    needs: test-coverage
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Download coverage JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-json-${{ github.run_id }}
          path: .
      - name: Generate manifest from real gates
        run: |
          python tools/dogfood_manifest.py --root=. --coverage-json=coverage.json --output=quality-manifest.json --notes-template=docs/RELEASE_NOTES.md --notes-output=docs/RELEASE_NOTES.generated.md --run-id="$GITHUB_RUN_ID" --commit-sha="$GITHUB_SHA"
      - name: Validate generated manifest
        run: |
          python - <<'PY'
          import json
          from tools.dogfood_manifest import validate_manifest

          with open("quality-manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          problems = validate_manifest(manifest, actions=True)
          if problems:
              raise SystemExit("manifest validation failed: " + "; ".join(problems))
          print("MANIFEST_VALID")
          PY
      - name: Rule source audit
        run: python tools/audit_rule_sources.py --root .
      - name: Upload generated manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-manifest-${{ github.run_id }}
          path: |
            quality-manifest.json
            quality-manifest.json.sha256
            docs/RELEASE_NOTES.generated.md
          if-no-files-found: error

  dogfood-verify:
    name: dogfood-verify
    needs: dogfood-generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[test]"
      - name: Download coverage JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-json-${{ github.run_id }}
          path: .
      - name: Download generated manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quality-manifest-${{ github.run_id }}
          path: artifact
      - name: Verify manifest hash
        run: |
          actual=$(sha256sum artifact/quality-manifest.json | awk '{print $1}')
          expected=$(awk '{print $1}' artifact/quality-manifest.json.sha256)
          echo "artifact_manifest=$GITHUB_WORKSPACE/artifact/quality-manifest.json"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"
      - name: Verify manifest with CBP from artifact
        env:
          CBP_MANIFEST: ${{ github.workspace }}/artifact/quality-manifest.json
          CBP_NOTES: ${{ github.workspace }}/artifact/docs/RELEASE_NOTES.generated.md
        run: |
          echo "CBP_MANIFEST=$CBP_MANIFEST"
          python -m cbp.cli --root . --mode enforce --manifest="$CBP_MANIFEST" --claims-notes="$CBP_NOTES"

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - run: python -m pip install .
      - name: Bare-repository quick start
        run: |
          mkdir -p /tmp/cbp-quickstart
          cd /tmp/cbp-quickstart
          cbp init --root .
          test -f cbp.json
          cbp --root . | tee result.txt
          grep -q 'CBP_RESULT=PASS' result.txt
          grep -q 'SKIPPED (not configured)' result.txt
